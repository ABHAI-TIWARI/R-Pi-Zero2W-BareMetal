name: Update clone stats

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-clones:
    runs-on: ubuntu-latest
    env:
      TRAFFIC_PATH: .github/traffic/clones.json
      TRAFFIC_DIR: .github/traffic
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Update total clones
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const path = process.env.TRAFFIC_PATH;
            const dir = process.env.TRAFFIC_DIR;

            let saved = { count: 0, uniques: 0, lastUpdated: null, clones: [] };
            if (fs.existsSync(path)) {
              try {
                saved = JSON.parse(fs.readFileSync(path, "utf8"));
              } catch (error) {
                throw new Error(`Invalid JSON in ${path}: ${error.message}`);
              }
            }

            const response = await github.rest.repos.getClones({
              owner: context.repo.owner,
              repo: context.repo.repo,
              per: "day"
            });

            const existing = new Map(
              (saved.clones || []).map((entry) => [entry.timestamp, entry])
            );

            for (const entry of response.data.clones || []) {
              existing.set(entry.timestamp, entry);
            }

            const all = Array.from(existing.values()).sort((a, b) =>
              a.timestamp.localeCompare(b.timestamp)
            );

            const total = all.reduce(
              (acc, entry) => {
                acc.count += entry.count || 0;
                acc.uniques += entry.uniques || 0;
                return acc;
              },
              { count: 0, uniques: 0 }
            );

            const output = {
              count: total.count,
              uniques: total.uniques,
              lastUpdated: new Date().toISOString(),
              clones: all
            };

            fs.mkdirSync(dir, { recursive: true });
            fs.writeFileSync(path, JSON.stringify(output, null, 2) + "\n");

      - name: Commit updated stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$TRAFFIC_PATH"
          git diff --cached --quiet || git commit -m "chore: update clone stats"
          git push
